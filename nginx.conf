# nginx do we-sync-front: só arquivos estáticos. Cabe em 16m / 0,05 CPU (feature 004, ADR-17).
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 80;
    root /usr/share/nginx/html;

    # Arquivos com hash do esbuild (main-XXXXXXXX.js, chunk-XXXXXXXX.js, styles-XXXXXXXX.css): cache longo.
    location ~* "-[A-Z0-9]{8}\.(?:js|css)$" {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
      include security-headers.conf;
    }

    # Fallback de SPA: index.html (e theme-init.js, sem hash) sempre revalidados.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
      include security-headers.conf;
    }
  }
}
