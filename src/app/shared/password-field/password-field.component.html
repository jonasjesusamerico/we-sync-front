<label class="form-label" [for]="inputId">{{ label() }}</label>
<div class="input-group has-validation">
  <input
    class="form-control form-control-lg"
    [id]="inputId"
    [type]="visible() ? 'text' : 'password'"
    [formControl]="control()"
    [attr.autocomplete]="autocomplete()"
    [class.is-invalid]="errorMessage() !== null"
    [attr.aria-invalid]="errorMessage() !== null"
    [attr.aria-describedby]="errorMessage() !== null ? errorId : null"
  />
  <button
    type="button"
    class="btn btn-outline-secondary toggle"
    [class.active]="visible()"
    [attr.aria-label]="toggleLabel()"
    [attr.aria-pressed]="visible()"
    (mousedown)="$event.preventDefault()"
    (click)="toggle()"
  >
    <i class="pe-7s-look" aria-hidden="true"></i>
  </button>
  @if (errorMessage(); as message) {
    <div class="invalid-feedback" [id]="errorId">{{ message }}</div>
  }
</div>
