<div class="auth-page">
  <h1>{{ text.register }}</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3 field">
      <label class="form-label" for="register-email">{{ text.email }}</label>
      <input
        id="register-email"
        class="form-control form-control-lg"
        type="email"
        autocomplete="email"
        inputmode="email"
        formControlName="email"
        [class.is-invalid]="emailError() !== null"
        [attr.aria-invalid]="emailError() !== null"
        [attr.aria-describedby]="emailError() !== null ? 'register-email-error' : null"
      />
      @if (emailError(); as message) {
        <div class="invalid-feedback" id="register-email-error">{{ message }}</div>
      }
    </div>

    <app-password-field
      class="mb-3 field"
      [control]="form.controls.password"
      [label]="text.password"
      kind="password"
      autocomplete="new-password"
    />

    <app-password-field
      class="mb-3 field"
      [control]="form.controls.confirmPassword"
      [label]="text.confirmPassword"
      kind="confirmPassword"
      autocomplete="new-password"
    />

    @if (alert(); as current) {
      @if (current.kind === 'conflict') {
        <app-form-alert kind="error">
          {{ text.emailTaken }}
          <a class="alert-link" routerLink="/login" [state]="loginState()">{{ text.login }}</a>
        </app-form-alert>
      } @else {
        <app-form-alert kind="error">{{ current.message }}</app-form-alert>
      }
    }

    <div class="actions">
      <button class="btn btn-primary btn-lg px-4 submit" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        }
        {{ text.register }}
      </button>
    </div>
  </form>
</div>
