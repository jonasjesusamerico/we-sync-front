<div class="auth-page">
  <h1>{{ text.register }}</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <mat-form-field class="field">
      <mat-label>{{ text.email }}</mat-label>
      <input matInput type="email" autocomplete="email" inputmode="email" formControlName="email" />
      <mat-error>{{ emailError() }}</mat-error>
    </mat-form-field>

    <app-password-field
      [control]="form.controls.password"
      [label]="text.password"
      kind="password"
      autocomplete="new-password"
    />

    <app-password-field
      [control]="form.controls.confirmPassword"
      [label]="text.confirmPassword"
      kind="confirmPassword"
      autocomplete="new-password"
    />

    @if (alert(); as current) {
      @if (current.kind === 'conflict') {
        <app-form-alert kind="error">
          {{ text.emailTaken }}
          <a routerLink="/login" [state]="loginState()">{{ text.login }}</a>
        </app-form-alert>
      } @else {
        <app-form-alert kind="error">{{ current.message }}</app-form-alert>
      }
    }

    <button mat-flat-button class="submit" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-progress-spinner diameter="20" mode="indeterminate" />
      }
      {{ text.register }}
    </button>
  </form>
</div>
