<div class="auth-page">
  <h1>{{ text.login }}</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (alert(); as current) {
      <app-form-alert [kind]="current.kind">{{ current.message }}</app-form-alert>
    }

    <div class="mb-3 field">
      <label class="form-label" for="login-email">{{ text.email }}</label>
      <input
        id="login-email"
        class="form-control form-control-lg"
        type="email"
        autocomplete="email"
        inputmode="email"
        formControlName="email"
        [class.is-invalid]="emailError() !== null"
        [attr.aria-invalid]="emailError() !== null"
        [attr.aria-describedby]="emailError() !== null ? 'login-email-error' : null"
      />
      @if (emailError(); as message) {
        <div class="invalid-feedback" id="login-email-error">{{ message }}</div>
      }
    </div>

    <app-password-field
      class="mb-3 field"
      [control]="form.controls.password"
      [label]="text.password"
      kind="password"
      autocomplete="current-password"
    />

    <div class="actions">
      <button class="btn btn-primary btn-lg px-4 submit" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        }
        {{ text.login }}
      </button>
    </div>
  </form>
</div>
