<div class="auth-page">
  <h1>{{ text.login }}</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (alert(); as current) {
      <app-form-alert [kind]="current.kind">{{ current.message }}</app-form-alert>
    }

    <mat-form-field class="field">
      <mat-label>{{ text.email }}</mat-label>
      <input matInput type="email" autocomplete="email" inputmode="email" formControlName="email" />
      <mat-error>{{ emailError() }}</mat-error>
    </mat-form-field>

    <app-password-field
      [control]="form.controls.password"
      [label]="text.password"
      kind="password"
      autocomplete="current-password"
    />

    <button mat-flat-button class="submit" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-progress-spinner diameter="20" mode="indeterminate" />
      }
      {{ text.login }}
    </button>
  </form>
</div>
