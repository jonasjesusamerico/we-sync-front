<mat-toolbar>
  @if (!isWide()) {
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="text.openMenu"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="app-sidenav"
      (click)="openMenu()"
    >
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>
  }
  <app-brand size="small" tone="on-primary" />
  <span class="spacer"></span>
  <button
    mat-icon-button
    type="button"
    [attr.aria-label]="text.account"
    [matMenuTriggerFor]="accountMenu"
  >
    <mat-icon aria-hidden="true">account_circle</mat-icon>
  </button>
</mat-toolbar>
<mat-menu #accountMenu="matMenu" xPosition="before">
  <button mat-menu-item type="button" (click)="logout()" [disabled]="loggingOut()">
    {{ text.logout }}
  </button>
</mat-menu>
<mat-sidenav-container>
  <mat-sidenav
    #sidenav
    id="app-sidenav"
    [mode]="isWide() ? 'side' : 'over'"
    [opened]="isWide() || menuOpen()"
    [disableClose]="isWide()"
    (openedChange)="onOpenedChange(sidenav.opened)"
  >
    <nav [attr.aria-label]="text.mainNav">
      <mat-nav-list>
        @for (item of navItems; track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive="nav-active"
            [routerLinkActiveOptions]="item.match"
            ariaCurrentWhenActive="page"
            (click)="onNavigate()"
          >
            <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <main class="content"><router-outlet /></main>
  </mat-sidenav-content>
</mat-sidenav-container>
