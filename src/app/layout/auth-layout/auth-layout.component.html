<div class="form-side">
  <div class="form-column">
    <app-brand class="brand-small" size="small" tone="primary" />
    <nav mat-tab-nav-bar mat-stretch-tabs [tabPanel]="panel" [attr.aria-label]="tabsLabel">
      @for (tab of tabs; track tab.path) {
        <a
          mat-tab-link
          [routerLink]="tab.path"
          routerLinkActive
          #rla="routerLinkActive"
          [active]="rla.isActive"
        >
          {{ tab.label }}
        </a>
      }
    </nav>
    <mat-tab-nav-panel #panel><router-outlet /></mat-tab-nav-panel>
  </div>
</div>
<aside class="auth-panel" aria-hidden="true"><app-brand size="large" tone="on-primary" /></aside>
